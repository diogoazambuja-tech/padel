<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Padel Remote</title>
<style>
/* Página-comando: cada botão identifica a equipa com nome, resultado e quem
   serve. Funciona no mini-browser do Apple Watch (link aberto em Mensagens),
   num telemóvel antigo, em qualquer lado. */
html,body{margin:0;height:100%;}
body{background:#07101f;font-family:-apple-system,'Outfit',sans-serif;display:flex;flex-direction:column;}
#status{flex:0 0 auto;text-align:center;color:#8fa8c8;font-size:3vh;padding:1vh 2vw;min-height:3.4vh;background:#0d1a2e;border-bottom:1px solid #1a2d47;}
button{border:none;color:#fff;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6vh;}
#t1{flex:1;background:#0a7d43;}
#t2{flex:1;background:#b45414;}
.bl{font-size:5vh;font-weight:700;max-width:94vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.bs{font-size:7.5vh;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.05em;line-height:1;}
.bsub{font-size:3vh;font-weight:500;opacity:.8;}
#undo{flex:0 0 13%;background:#1a2d47;font-size:4vh;font-weight:500;}
#undo.arm{background:#8a1d1d;font-weight:700;}
button:active{filter:brightness(1.3);}
</style>
</head>
<body>
<div id="status">A ligar…</div>
<button id="t1" onclick="point(0)">
  <span class="bl" id="bn0">🟢 Eq. 1</span>
  <span class="bs" id="bv0"></span>
  <span class="bsub">+ Ponto</span>
</button>
<button id="t2" onclick="point(1)">
  <span class="bl" id="bn1">🟠 Eq. 2</span>
  <span class="bs" id="bv1"></span>
  <span class="bsub">+ Ponto</span>
</button>
<button id="undo" onclick="undo()">↩️ Desfazer</button>
<script>
var busy=false,lastTap=0,armed=false,armTimer=null;
var ICONS=['🟢','🟠'];
function el(id){return document.getElementById(id);}
function msg(t){el('status').textContent=t;}

function refresh(){
  fetch('/api/state').then(function(r){return r.json();}).then(function(d){
    if(!d.active){
      el('bn0').textContent='🟢 Eq. 1';el('bn1').textContent='🟠 Eq. 2';
      el('bv0').textContent='';el('bv1').textContent='';
      msg('Sem jogo ativo — inicia no separador 🔴 Live da app');
      return;
    }
    for(var i=0;i<2;i++){
      // 🎾 dentro do botão identifica quem serve
      el('bn'+i).textContent=(d.serving===i?'🎾 ':'')+ICONS[i]+' '+(d.names[i]||'Eq. '+(i+1));
      el('bv'+i).textContent=d.setsWon[i]+' · '+d.games[i]+' · '+d.pts[i];
    }
    if(d.finished)msg('🏆 '+(d.names[d.winner-1]||'Equipa '+d.winner)+' venceu!');
    else if(d.tb)msg('TIE-BREAK · sets · jogos · pontos');
    else msg('sets · jogos · pontos · 🎾 = a servir');
  }).catch(function(){msg('⚠️ Sem ligação');});
}

function send(q){
  if(busy)return;busy=true;
  fetch('/api/point?'+q)
    .then(function(){refresh();})
    .catch(function(){msg('⚠️ Sem ligação');})
    .finally(function(){setTimeout(function(){busy=false;},600);});
}
function point(t){
  var n=Date.now();if(n-lastTap<400)return;lastTap=n;
  disarm();send('team='+t);
}
function undo(){
  if(!armed){
    armed=true;
    el('undo').classList.add('arm');
    el('undo').textContent='⚠️ Confirmar correção';
    armTimer=setTimeout(function(){disarm();},2500);
    return;
  }
  disarm();send('undo=1');
}
function disarm(){
  armed=false;clearTimeout(armTimer);
  el('undo').classList.remove('arm');
  el('undo').textContent='↩️ Desfazer';
}
refresh();
setInterval(refresh,4000);
</script>
</body>
</html>
